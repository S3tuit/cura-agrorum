[project]
name = "cura-agrorum-server"
version = "0.1.0"
description = "TCP gateway server for Cura Agrorum ESP32 sensor nodes"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cura-agrorum-server = "cura_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cura_server"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
