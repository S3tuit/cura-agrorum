[pytest]
addopts =
    --strict-config
    --strict-markers
    --import-mode=importlib
    -p hypothesispytest
    -p no:pytest_embedded
testpaths = tests/host
pythonpath = . ../protocol/protocol-v2-lora/python
required_plugins = hypothesis>=6
xfail_strict = true
empty_parameter_set_mark = fail_at_collect
markers =
    hardware: requires the target Raspberry Pi or its deployed Linux stack
    slow: deliberately unsuitable for the ordinary validation loop
    destructive: may change target state or exercise a bounded failure fixture
    rf_peer: requires the separately controlled radio peer and RF fixture
    radio: requires the fitted and operator-confirmed SX1262 carrier
    radio_fault: requires the isolated BUSY fault gate in its confirmed position
    radio_busy_held: requires the isolated manual BUSY-high selector and a dedicated run
